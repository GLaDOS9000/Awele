name: CI

on:
  push:
    branches: [main, "feat-*"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint (ty)
        run: uv run ty check

      - name: Tests (pytest)
        run: uv run pytest tests/ -q
